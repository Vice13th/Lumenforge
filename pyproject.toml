[project]
name = "lumenforge"
version = "2.0.0"
description = "LumenForge desktop image editor and rendering engine"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.5.3",
  "pillow==11.3.0",
  "numba==0.67.0",
  "rawpy==0.27.1",
  "opencv-python==4.10.0.84",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pyinstaller==6.22.3",
  "nuitka>=4.2.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
